name: SSV Network local static analysis

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/ssv-static-analysis.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: SSV Network git ref to analyze
        required: true
        default: main
      run_aderyn:
        description: Run Aderyn CI analysis
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ssv-local-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout AFB scanner
        uses: actions/checkout@v4
        with:
          path: afb

      - name: Checkout SSV Network source
        uses: actions/checkout@v4
        with:
          repository: ssvlabs/ssv-network
          ref: ${{ inputs.source_ref || 'main' }}
          path: ssv-network
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ssv-network/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SSV dependencies
        working-directory: ssv-network
        run: npm ci

      - name: Compile SSV contracts locally
        working-directory: ssv-network
        run: npx hardhat compile --force

      - name: Install Slither and AFB analysis extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./afb[analysis]"
          python -m pip install solc-select
          solc-select install 0.8.24
          solc-select use 0.8.24
          slither --version

      - name: Run AFB unit tests
        id: tests
        run: python -m unittest discover -s afb/tests -v

      - name: Run Slither on local SSV source
        id: slither
        continue-on-error: true
        working-directory: ssv-network
        run: |
          mkdir -p ../reports
          slither . --compile-force-framework hardhat --hardhat-ignore-compile --solc-remaps @openzeppelin=node_modules/@openzeppelin --filter-paths "contracts/test/" --exclude-informational --exclude-dependencies --fail-none --json ../reports/slither.json

      - name: Run AFB semantic state and CFG review
        id: afb
        if: always()
        run: |
          mkdir -p reports
          python -c "import json; from pathlib import Path; from afb_immunefi.logic_analysis import run_logic_review; p=run_logic_review(Path('ssv-network')); Path('reports/afb-logic-review.json').write_text(json.dumps(p, indent=2)); print(json.dumps({k:p.get(k) for k in ('status','contracts_analyzed','entrypoints_analyzed','cfg_nodes_analyzed','invariant_candidates_count','findings_count','analysis_capabilities')}, indent=2)); raise SystemExit(0 if p.get('status') == 'completed' else 2)"

      - name: Install Aderyn
        if: always() && (github.event_name == 'push' || inputs.run_aderyn)
        run: npm install --global @cyfrin/aderyn@0.6

      - name: Run Aderyn on local SSV source
        id: aderyn
        if: always() && (github.event_name == 'push' || inputs.run_aderyn)
        working-directory: ssv-network
        run: |
          mkdir -p ../reports
          aderyn . -o ../reports/aderyn-report.md --no-snippets --skip-update-check

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssv-network-static-analysis
          path: |
            reports/
            ssv-network/report.md
            ssv-network/slither.db.json
          if-no-files-found: warn

      - name: Enforce analysis results
        if: always()
        env:
          SLITHER_OUTCOME: ${{ steps.slither.outcome }}
          AFB_OUTCOME: ${{ steps.afb.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          ADERYN_OUTCOME: ${{ steps.aderyn.outcome }}
          RUN_ADERYN: ${{ github.event_name == 'push' || inputs.run_aderyn }}
        run: |
          echo "Slither: ${SLITHER_OUTCOME}"
          echo "AFB: ${AFB_OUTCOME}"
          echo "Aderyn: ${ADERYN_OUTCOME:-skipped}"
          test "${TEST_OUTCOME}" = "success"
          test "${SLITHER_OUTCOME}" = "success"
          test "${AFB_OUTCOME}" = "success"
          if [ "${RUN_ADERYN}" = "true" ]; then
            test "${ADERYN_OUTCOME}" = "success"
          fi
