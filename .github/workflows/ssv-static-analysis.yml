name: SSV Network local static analysis

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: SSV Network git ref to analyze
        required: true
        default: main
      run_aderyn:
        description: Run Aderyn CI analysis
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ssv-local-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout AFB scanner
        uses: actions/checkout@v4
        with:
          path: afb

      - name: Checkout SSV Network source
        uses: actions/checkout@v4
        with:
          repository: ssvlabs/ssv-network
          ref: ${{ inputs.source_ref }}
          path: ssv-network
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ssv-network/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SSV dependencies
        working-directory: ssv-network
        run: npm ci

      - name: Compile SSV contracts locally
        working-directory: ssv-network
        run: npx hardhat compile --force

      - name: Install Slither and AFB analysis extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./afb[analysis]"
          python -m pip install solc-select
          solc-select install 0.8.24
          solc-select use 0.8.24
          slither --version

      - name: Run Slither on local SSV source
        working-directory: ssv-network
        run: |
          mkdir -p ../reports
          slither . --hardhat-ignore-compile --solc-remaps @openzeppelin=node_modules/@openzeppelin --filter-paths "contracts/test/" --exclude-informational --exclude-dependencies --json ../reports/slither.json

      - name: Run AFB semantic state and CFG review
        run: |
          mkdir -p reports
          python -c "import json; from pathlib import Path; from afb_immunefi.logic_analysis import run_logic_review; p=run_logic_review(Path('ssv-network')); Path('reports/afb-logic-review.json').write_text(json.dumps(p, indent=2)); print(json.dumps({k:p.get(k) for k in ('status','contracts_analyzed','entrypoints_analyzed','cfg_nodes_analyzed','invariant_candidates_count','findings_count','analysis_capabilities')}, indent=2)); raise SystemExit(0 if p.get('status') == 'completed' else 2)"

      - name: Run Aderyn CI analysis
        if: inputs.run_aderyn
        uses: Cyfrin/aderyn-ci@v0
        with:
          warn-on: any

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssv-network-static-analysis
          path: |
            reports/
            ssv-network/report.md
            ssv-network/slither.db.json
          if-no-files-found: warn
