[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afb-immunefi-scanner"
version = "0.1.0"
description = "Scope-first, local-first smart-contract security research assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AFB Immunefi Scanner contributors" }]
dependencies = ["PyYAML>=6.0.1", "pypdf>=5.0.0"]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]

[project.scripts]
afb-immunefi = "afb_immunefi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
