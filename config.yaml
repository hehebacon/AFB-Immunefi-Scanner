app:
  name: AFB Immunefi Scanner
  version: 0.1.0
  workspace: ./workspace

safety:
  require_policy_before_analysis: true
  live_transactions: false
  active_target_probing: false
  automatic_submission: false
  local_verification_only: true

analysis:
  slither:
    enabled: true
    executable: slither
  aderyn:
    enabled: true
    executable: aderyn
  foundry:
    enabled: true
    executable: forge
